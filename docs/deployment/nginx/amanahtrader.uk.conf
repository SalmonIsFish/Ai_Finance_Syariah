# Hardened vhost for amanahtrader.uk.
#
# This is the reviewable copy. The file that actually runs is
# /etc/nginx/sites-available/amanahtrader.uk on the droplet.
#
# DIFF BEFORE YOU COPY. These two drifted apart once already: on 2026-09-21 the
# live file had gained /hackathon/, both /thetanuts/ blocks and the root 302 to
# /dashboard/, none of which were here. A straight `cp` would have taken three
# applications offline. They are in step as of 2026-09-21, and the only way to
# know that is still true is to check:
#
#   diff <(ssh amanah@159.65.220.83 sudo cat /etc/nginx/sites-available/amanahtrader.uk) \
#        docs/deployment/nginx/amanahtrader.uk.conf
#
# If it differs, work out which side is right before overwriting either. Then:
#   sudo cp amanahtrader.uk.conf /etc/nginx/sites-available/amanahtrader.uk
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` is not optional -- it is the difference between a rejected config
# and a dead site.
#
# Depends on /etc/nginx/conf.d/amanah_operator_key.conf, which defines
# $amanah_operator_ok and is the one file holding a secret. It is root-owned,
# mode 0600, and never committed. Generate it on the box:
#
#   KEY=$(openssl rand -hex 32)
#   printf 'map $http_x_amanah_operator $amanah_operator_ok {\n    default 0;\n    "%s" 1;\n}\n' "$KEY" \
#     | sudo tee /etc/nginx/conf.d/amanah_operator_key.conf >/dev/null
#   sudo chown root:root /etc/nginx/conf.d/amanah_operator_key.conf
#   sudo chmod 600 /etc/nginx/conf.d/amanah_operator_key.conf
#
# nginx.conf includes conf.d/* before sites-enabled/*, so the map is defined by
# the time this file references it.
#
# It also depends on /etc/nginx/conf.d/00-amanah-tuning.conf, which sets
# map_hash_bucket_size 128. A 64-hex-character key overflows nginx's default
# bucket size of 64 and makes the ENTIRE config fail to build with
# "could not build map_hash" -- not just this vhost. That file is not secret and
# is reproduced at docs/deployment/nginx/00-amanah-tuning.conf. Validate with a
# key of realistic length: a short placeholder fits in the default bucket and
# hides the failure.

# Writes to the ledger and to the broker need the operator key; reads never do.
# /audit is both a GET the dashboard depends on and a POST that forges ledger
# entries, so the check is scoped by method rather than by path alone.
map "$request_method:$amanah_operator_ok" $amanah_write_denied {
    default        1;
    "~^GET:"       0;
    "~^HEAD:"      0;
    "~^OPTIONS:"   0;
    "~^[A-Z]+:1$"  0;
}

# Roughly 20 requests/minute per IP against the open POST routes. The dashboard
# drives one preview at a time, so a judge clicking through never notices; a
# script hammering /paper/preview does. Real traffic on this host is ~100
# successful requests a day against ~261,000 scanner 404s, so the ceiling is
# generous by two orders of magnitude.
limit_req_zone $binary_remote_addr zone=amanah_write:10m rate=20r/m;

# Brute-force ceiling for everything reaching `location /`. Every route there is
# behind HTTP Basic auth in local_api.py, but authentication without a rate limit
# means credentials can be guessed as fast as the network allows -- `location /`
# had no limit_req at all, so the only protection was the password itself.
# Deliberately generous at 4r/s: the dashboard loads a dozen-plus endpoints per
# refresh, so this must not bite a real user, while still sitting far below what
# an online guessing attack needs to be worth running. It slows; it does not ban.
#
# Scoped to `location /` rather than the server block on purpose: /hackathon/ and
# /thetanuts/ are separate applications on this host and are left exactly as they
# were.
limit_req_zone $binary_remote_addr zone=amanah_general:10m rate=240r/m;
limit_req_status 429;

server {
    server_name amanahtrader.uk www.amanahtrader.uk;

    server_tokens off;

    # add_header does not inherit into a location that sets its own headers, so
    # "always" plus repetition in each location is deliberate, not redundant.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The interactive API docs advertise the entire write surface, including the
    # execute route. Killed here rather than in local_api.py so local development
    # keeps /docs.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Scanner bait: dotfiles, VCS metadata, and the credential filenames this box
    # is actually probed for. Answered by nginx so they never cost a Python
    # round-trip. Logged separately to keep the real access log readable.
    location ~ ^/(\.|secrets\.(ya?ml|json)|config\.(json|ya?ml)|.*\.(php|asp|aspx|jsp|env|sql|bak)$) {
        access_log /var/log/nginx/scanner.log;
        return 404;
    }

    # Broker submission and ledger reconciliation. Both are POST-only in
    # local_api.py, so every method here requires the key.
    location ~ ^/paper/(execute|reconcile)/ {
        if ($amanah_operator_ok = 0) {
            return 401;
        }
        limit_req zone=amanah_write burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /audit is the dashboard's execution-audit view and stays public.
    # POST /audit writes an audit record and does not.
    location = /audit {
        if ($amanah_write_denied = 1) {
            return 401;
        }
        limit_req zone=amanah_write burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open but rate-limited: none of these can reach the broker, and the gate
    # chain refuses a non-compliant order regardless of who asked. Judges need
    # them to click a preview through on the live demo.
    location ~ ^/(paper/(preview|approval)|watchlist)$ {
        limit_req zone=amanah_write burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hackathon/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /thetanuts/api/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /thetanuts/ {
        alias /home/amanah/thetanuts-copilot/frontend/dist/;
        try_files $uri $uri/ /thetanuts/index.html;
    }

    # Hackathon redirect: root to dashboard
    location = / {
        return 302 /dashboard/;
    }

    # P3 portfolio and copilot routes. Authenticated in local_api.py (HTTP Basic),
    # but auth does not throttle. They get the write zone rather than the general
    # one because the P3 POSTs propose, approve and execute orders, and the
    # copilot POSTs call OpenRouter, so each one spends real money. These are
    # low-frequency operator actions, not dashboard polling, so 20r/m is not
    # restrictive in practice.
    #
    # Until 2026-09-21 these lived under /api/ and fell through to a bare
    # `location /` with no auth and no rate limit at all -- POST
    # /api/p3/portfolios was an unauthenticated database write reachable from the
    # internet. The app-side fix is the real one; this is defence in depth.
    location ~ ^/(p3|copilot)/ {
        limit_req zone=amanah_write burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=amanah_general burst=60 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/amanahtrader.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/amanahtrader.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.amanahtrader.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = amanahtrader.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name amanahtrader.uk www.amanahtrader.uk;
    return 404; # managed by Certbot
}
